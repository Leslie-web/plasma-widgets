# cava config used by plasma-waveform-helper for the org.leslie.nowplaying applet.
# Raw ASCII frames on stdout, one frame per line, semicolon-separated sample values.
# If cava is not installed:  sudo dnf install cava

[general]
framerate = 20
bars = 96
lower_cutoff_freq = 50
higher_cutoff_freq = 12000
sleep_timer = 0
autosens = 1
sensitivity = 100

[input]
# "pulse" works through pipewire-pulse; switch to "pipewire" for native capture.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

# cava 0.10.2 segfaults in oscilloscope mode on this PipeWire stack (it emits
# one frame of 100s, then dumps core), and the Fedora build has no native
# 'pipewire' input support. So use the spectrum here and let the applet draw it
# as a mirrored, smoothed trace.
waveform = 0
waveform_sync = 0

[smoothing]
noise_reduction = 60
monstercat = 0
waves = 0
